<!DOCTYPE html>
<html>
<body>
  <h2>Ride-Sharing WebSocket Test</h2>
  <button onclick="sendLocation()">লোকেশন আপডেট পাঠান</button>
  <script>
    const socket = new WebSocket('ws://localhost:3000');

    socket.onopen = () => {
      console.log('সার্ভারের সাথে কানেক্ট হয়েছে!');
    };

    function sendLocation() {
      const data = JSON.stringify({
        type: 'LOCATION_UPDATE',
        lat: 23.8103,
        lng: 90.4125
      });
      socket.send(data);
      alert('লোকেশন পাঠানো হয়েছে!');
    }
  </script>
</body>
</html>
